<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="screen-orientation" content="landscape" />
  <meta name="x5-orientation" content="landscape" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Kage no Kiro</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="page-shell">
    <section class="game-wrapper">
      <div class="game-header">
        <div>
          <p class="eyebrow">AnimerDash apresenta</p>
          <h1>Kage no Kiro</h1>
        </div>
        <p class="game-subtitle">Jogo 2D web de ação ninja original</p>
      </div>

      <div class="orientation-warning">
        <strong>Vire o celular</strong>
        <span>Este jogo foi pensado para jogar na horizontal.</span>
      </div>

      <div id="game-container" aria-label="Área do jogo Kage no Kiro"></div>

      <div class="controls-help">
        <strong>Controles:</strong>
        <span>PC: WASD/setas, Espaço, J, K, L, I</span>
        <span>Mobile: use os botões virtuais na tela</span>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script type="module" src="./main.js"></script>
</body>
</html>
