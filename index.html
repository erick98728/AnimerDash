<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kage no Kiro</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="page-shell">
    <section class="game-wrapper">
      <div class="game-header">
        <div>
          <p class="eyebrow">AnimerDash apresenta</p>
          <h1>Kage no Kiro</h1>
        </div>
        <p class="game-subtitle">Jogo 2D web de ação ninja original</p>
      </div>

      <div id="game-container" aria-label="Área do jogo Kage no Kiro"></div>

      <div class="controls-help">
        <strong>Controles:</strong>
        <span>WASD ou setas para mover</span>
        <span>Espaço para pular</span>
        <span>J para atacar</span>
        <span>K para esquivar</span>
        <span>L para lançar projétil</span>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script type="module" src="./main.js"></script>
</body>
</html>
